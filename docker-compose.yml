services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql://careerquest:${POSTGRES_PASSWORD:-careerquest-local}@db:5432/careerquest
      FRONTEND_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        API_ORIGIN: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: careerquest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careerquest-local}
      POSTGRES_DB: careerquest
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerquest -d careerquest"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
